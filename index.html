<!DOCTYPE html>
<html>
<head>
  <title>Firebase Photo Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    input, button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      margin: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #00c853;
      color: white;
      cursor: pointer;
    }

    video, canvas, img {
      width: 90%;
      max-width: 360px;
      border-radius: 12px;
      margin-top: 10px;
      background: #000;
    }

    #status {
      margin-top: 15px;
      color: #00e676;
    }
  </style>
</head>

<body>

  <h2>Take Photo & Send</h2>

  <input id="nameInput" type="text" placeholder="Name">
  <input id="messageInput" type="text" placeholder="Message">

  <br>

  <video id="video" autoplay playsinline muted></video>

  <br>

  <button onclick="takePhoto()">Take Photo</button>
  <button onclick="sendToFirebase()">Send</button>

  <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

  <br>

  <img id="preview">

  <p id="status"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvVAMagfB-NeQx7t9jWMbYVrXyeVwc0kg",
  authDomain: "nibla-a5550.firebaseapp.com",
  databaseURL: "https://nibla-a5550-default-rtdb.firebaseio.com",
  projectId: "nibla-a5550",
  storageBucket: "nibla-a5550.firebasestorage.app",
  messagingSenderId: "595860598804",
  appId: "1:595860598804:web:37b9d413664153c9ca7701",
  measurementId: "G-8S8CK0ES6T"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const preview = document.getElementById("preview");
  const statusText = document.getElementById("status");

  let photoBlob = null;

  async function startCamera() {
    try {
      statusText.innerText = "Opening camera...";

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      statusText.innerText = "Camera ready";

    } catch (err) {
      console.error(err);

      if (err.name === "NotReadableError") {
        statusText.innerText = "Camera is busy. Close Unity, Zoom, OBS, or Camera app.";
        alert("Camera is busy. Close Unity, Zoom, OBS, or Camera app, then refresh.");
      }
      else if (err.name === "NotAllowedError") {
        statusText.innerText = "Camera permission denied.";
        alert("Allow camera permission from Chrome.");
      }
      else if (err.name === "NotFoundError") {
        statusText.innerText = "No camera found.";
        alert("No camera found.");
      }
      else {
        statusText.innerText = "Camera error: " + err.message;
        alert("Camera error: " + err.message);
      }
    }
  }

  window.takePhoto = function () {
    if (!video.srcObject) {
      alert("Camera not ready");
      return;
    }

    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      photoBlob = blob;
      preview.src = URL.createObjectURL(blob);
      statusText.innerText = "Photo captured";
    }, "image/jpeg", 0.9);
  };

  window.sendToFirebase = async function () {
    try {
      const name = document.getElementById("nameInput").value.trim();
      const message = document.getElementById("messageInput").value.trim();

      if (!name) {
        alert("Enter name");
        return;
      }

      if (!message) {
        alert("Enter message");
        return;
      }

      if (!photoBlob) {
        alert("Take photo first");
        return;
      }

      statusText.innerText = "Uploading image...";

      const fileName = "userImages/" + Date.now() + ".jpg";
      const imgRef = storageRef(storage, fileName);

      await uploadBytes(imgRef, photoBlob);

      const imageUrl = await getDownloadURL(imgRef);

      statusText.innerText = "Sending data...";

      const newUserRef = push(ref(db, "users"));

      await set(newUserRef, {
        name: name,
        message: message,
        imageUrl: imageUrl,
        createdAt: Date.now()
      });

      statusText.innerText = "Sent successfully";

      alert("Sent successfully!");

      document.getElementById("nameInput").value = "";
      document.getElementById("messageInput").value = "";
      preview.src = "";
      photoBlob = null;

    } catch (err) {
      console.error(err);
      statusText.innerText = "Send error: " + err.message;
      alert("Send error: " + err.message);
    }
  };

  startCamera();
</script>

</body>
</html>

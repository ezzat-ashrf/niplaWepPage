<!DOCTYPE html>
<html>
<head>
  <title>NIBLA Photo Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,0,77,0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(123,31,162,0.45), transparent 40%),
        linear-gradient(135deg, #1A0B2E, #4B1D7A, #8C145E, #E0004D);
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 18px;
    }

    .card {
      width: 94%;
      max-width: 420px;
      padding: 20px;
      border-radius: 28px;
      background: rgba(255,255,255,0.09);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 0 45px rgba(224,0,77,0.35),
        0 0 90px rgba(123,31,162,0.25);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 70px;
      margin-bottom: 6px;
      animation: pulse 2.5s infinite;
    }

    h2 {
      margin: 6px 0;
      font-size: 22px;
    }

    .subtitle {
      margin-bottom: 16px;
      opacity: 0.85;
      font-size: 13px;
    }

    .previewBox {
      width: 190px;
      height: 190px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 5px;
      background:
        linear-gradient(#111, #111) padding-box,
        linear-gradient(135deg, #7B1FA2, #C2185B, #FF004D) border-box;
      border: 5px solid transparent;
      overflow: hidden;
    }

    #preview {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #111;
    }

    input[type="file"] {
      display: none;
    }

    .photoBtn,
    .sendBtn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .photoBtn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
    }

    .sendBtn {
      background: linear-gradient(90deg, #7B1FA2, #C2185B, #FF004D);
      box-shadow: 0 8px 25px rgba(255,0,77,0.35);
    }

    #status {
      min-height: 22px;
      margin-top: 14px;
      font-size: 14px;
    }

    .success {
      color: #00ff99;
      font-weight: bold;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(255,0,77,0.4));
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 25px rgba(255,0,77,0.8));
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <img class="logo" src="logo.png">

    <h2>NIBLA Photo Upload</h2>
    <div class="subtitle">Take your photo and send it to the screen</div>

    <div class="previewBox">
      <img id="preview" src="">
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="camera">

    <button class="photoBtn" onclick="document.getElementById('fileInput').click()">
      📷 Take Photo
    </button>

    <button class="sendBtn" onclick="sendToFirebase()">
      SEND PHOTO
    </button>

    <p id="status"></p>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBvVAMagfB-NeQx7t9jWMbYVrXyeVwc0kg",
    authDomain: "nibla-a5550.firebaseapp.com",
    databaseURL: "https://nibla-a5550-default-rtdb.firebaseio.com",
    projectId: "nibla-a5550",
    storageBucket: "nibla-a5550.firebasestorage.app",
    messagingSenderId: "595860598804",
    appId: "1:595860598804:web:37b9d413664153c9ca7701",
    measurementId: "G-8S8CK0ES6T"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const statusText = document.getElementById("status");

  let photoBlob = null;
  let isSending = false;

  fileInput.addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;

    photoBlob = file;
    preview.src = URL.createObjectURL(file);

    statusText.className = "";
    statusText.innerText = "Photo selected";
  });

  window.sendToFirebase = async function () {
    try {
      if (isSending) return;

      if (!photoBlob) {
        alert("Take photo first");
        return;
      }

      isSending = true;
      statusText.className = "";
      statusText.innerText = "Uploading image...";

      const safeName = photoBlob.name
        ? photoBlob.name.replace(/[^a-zA-Z0-9._-]/g, "_")
        : "photo.jpg";

      const fileName = "userImages/" + Date.now() + "_" + safeName;
      const imgRef = storageRef(storage, fileName);

      await uploadBytes(imgRef, photoBlob);

      const imageUrl = await getDownloadURL(imgRef);

      statusText.innerText = "Sending image URL...";

      const newUserRef = push(ref(db, "users"));

      await set(newUserRef, {
        imageUrl: imageUrl
      });

      statusText.className = "success";
      statusText.innerText = "✅ Image sent successfully";

      setTimeout(() => {
        fileInput.value = "";
        preview.src = "";
        photoBlob = null;
        isSending = false;
        statusText.className = "";
        statusText.innerText = "";
      }, 3000);

    } catch (err) {
      console.error(err);
      isSending = false;
      statusText.className = "";
      statusText.innerText = "Error: " + err.message;
      alert("Error: " + err.message);
    }
  };
</script>

</body>
</html>

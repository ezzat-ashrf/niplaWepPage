<!DOCTYPE html>
<html>
<head>
  <title>Firebase Photo Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    input, button {
      width: 90%;
      max-width: 330px;
      padding: 12px;
      margin: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #00c853;
      color: white;
      cursor: pointer;
    }

    img {
      width: 90%;
      max-width: 360px;
      border-radius: 12px;
      margin-top: 10px;
      background: #000;
    }

    #status {
      margin-top: 15px;
      color: #00e676;
    }
  </style>
</head>

<body>

  <h2>Take Photo & Send</h2>

  <input id="nameInput" type="text" placeholder="Name">
  <input id="messageInput" type="text" placeholder="Message">

  <br>

  <input type="file" id="fileInput" accept="image/*" capture="camera">

  <br>

  <img id="preview">

  <br>

  <button onclick="sendToFirebase()">Send</button>

  <p id="status"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBvVAMagfB-NeQx7t9jWMbYVrXyeVwc0kg",
    authDomain: "nibla-a5550.firebaseapp.com",
    databaseURL: "https://nibla-a5550-default-rtdb.firebaseio.com",
    projectId: "nibla-a5550",
    storageBucket: "nibla-a5550.firebasestorage.app",
    messagingSenderId: "595860598804",
    appId: "1:595860598804:web:37b9d413664153c9ca7701",
    measurementId: "G-8S8CK0ES6T"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const statusText = document.getElementById("status");

  let photoBlob = null;

  fileInput.addEventListener("change", function (e) {
    const file = e.target.files[0];

    if (!file) return;

    photoBlob = file;
    preview.src = URL.createObjectURL(file);
    statusText.innerText = "Photo selected";
  });

  window.sendToFirebase = async function () {
    try {
      const name = document.getElementById("nameInput").value.trim();
      const message = document.getElementById("messageInput").value.trim();

      if (!name) {
        alert("Enter name");
        return;
      }

      if (!message) {
        alert("Enter message");
        return;
      }

      if (!photoBlob) {
        alert("Take or select photo first");
        return;
      }

      statusText.innerText = "Uploading image...";

      const fileName = "userImages/" + Date.now() + "_" + photoBlob.name;
      const imgRef = storageRef(storage, fileName);

      await uploadBytes(imgRef, photoBlob);

      const imageUrl = await getDownloadURL(imgRef);

      statusText.innerText = "Sending data...";

      const newUserRef = push(ref(db, "users"));

      await set(newUserRef, {
        name: name,
        message: message,
        imageUrl: imageUrl,
        createdAt: Date.now()
      });

      statusText.innerText = "Sent successfully";

      alert("Sent successfully!");

      document.getElementById("nameInput").value = "";
      document.getElementById("messageInput").value = "";
      fileInput.value = "";
      preview.src = "";
      photoBlob = null;

    } catch (err) {
      console.error(err);
      statusText.innerText = "Error: " + err.message;
      alert("Error: " + err.message);
    }
  };
</script>

</body>
</html>
